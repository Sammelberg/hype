# Local development database. Port 5433 avoids clashing with other local Postgres instances.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: port
      POSTGRES_PASSWORD: port
      POSTGRES_DB: port
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U port -d port"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
