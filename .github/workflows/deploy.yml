name: Deploy

# Puts main on the server once CI is green on it, or by hand (Actions → Deploy → Run workflow).
# The key in DEPLOY_SSH_KEY can do one thing on the server: its authorized_keys entry forces
# `git pull --ff-only && deploy/deploy.sh` (deploy/README.md, „Автоматически“).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SSH-Schlüssel
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        run: >-
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o ServerAliveInterval=30 ${{ vars.DEPLOY_HOST }}
      - name: Website antwortet
        run: curl -fsS -o /dev/null -w '%{http_code} %{time_total}s\n' ${{ vars.SITE_URL }}
