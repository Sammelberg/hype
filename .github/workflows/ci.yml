name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kern
          POSTGRES_PASSWORD: kern
          POSTGRES_DB: kern
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kern -d kern"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # The test mailbox the seed points the site at (e2e/mail.spec.ts reads it over its API).
      mailpit:
        image: axllent/mailpit:v1.31.3
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
          MP_DISABLE_VERSION_CHECK: "true"
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://kern:kern@localhost:5432/kern
      # One port for the build, the e2e server (standalone server.js) and Playwright
      # (playwright.config.ts waits on PORT).
      PORT: "3002"
      NEXT_PUBLIC_SERVER_URL: http://localhost:3002
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_ADMIN_PASSWORD: ci-only-e2e-admin-passwort
      FORM_SECRET: ci-only-form-secret-0123456789abcdef
      MAIL_SECRET: ci-only-mail-secret-0123456789abcdef
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      # The repository tests (*.db.test.ts) need the schema and the seeded pages.
      - run: pnpm migrate
      - run: pnpm seed
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
