version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Held majors (see CLAUDE.md, Toolchain): each waits for the ecosystem to catch up.
    ignore:
      # eslint-config-next's react, import and jsx-a11y plugins do not support ESLint 10 yet.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # `typescript` stays on 6 for the tools that need its JS API; TS 7 runs as `typescript-7`.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      drizzle:
        patterns: ["drizzle-orm", "drizzle-kit", "pg", "@types/pg"]
      lexical:
        patterns: ["lexical", "@lexical/*"]
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@next/*"]
      tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
