# Postgres on the server: only on localhost, data in a named volume, the password from
# deploy/.env.db (POSTGRES_PASSWORD, never committed). Start once:
#   docker compose -f deploy/docker-compose.server.yml --env-file deploy/.env.db up -d
name: schwarzwald

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: schwarzwald
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in deploy/.env.db}
      POSTGRES_DB: schwarzwald
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schwarzwald -d schwarzwald"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
